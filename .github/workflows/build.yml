name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Si subiste el proyecto como proyecto.zip, se extrae aquí
      - name: Extraer proyecto.zip (si existe)
        run: |
          if [ -f proyecto.zip ]; then unzip -oq proyecto.zip; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (release, firmado con clave debug)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PizarraDev-apk
          path: app/build/outputs/apk/release/*.apk
